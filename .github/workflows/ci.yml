name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install ruff pytest aiohttp
      - name: Compile
        run: python -m compileall -q custom_components migrate.py
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
